<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>소영 기말 촬영표</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: a film-shoot schedule. Slate header -> playhead timeline -> tabs (오늘 / 전체 / 리포트). Each lecture is a "씬", durations are timecode. */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --sunk:#ECEEF3; --ink:#1A1D2A; --muted:#656B80; --line:#DFE2EA;
  --rec:#F0452F; --rec-soft:#FDE7E3; --good:#1F9D62;
  --ko:#D3416A; --ma:#2C67DA; --so:#B97C0B; --sc:#0F857A; --hi:#7247D0;
  --f-display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11131B; --surface:#1A1D28; --sunk:#232736; --ink:#ECEDF3; --muted:#9BA1B6; --line:#2B3042;
  --rec:#FF6450; --rec-soft:#3A1F1C; --good:#4CC98C;
  --ko:#F27A9B; --ma:#6F9DF6; --so:#E4AE48; --sc:#3CC3B2; --hi:#A98CF2; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#11131B; --surface:#1A1D28; --sunk:#232736; --ink:#ECEDF3; --muted:#9BA1B6; --line:#2B3042;
  --rec:#FF6450; --rec-soft:#3A1F1C; --good:#4CC98C;
  --ko:#F27A9B; --ma:#6F9DF6; --so:#E4AE48; --sc:#3CC3B2; --hi:#A98CF2; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ma);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px;display:flex;flex-direction:column;gap:18px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* subject colors */
[data-s="ko"]{--c:var(--ko)} [data-s="ma"]{--c:var(--ma)} [data-s="so"]{--c:var(--so)} [data-s="sc"]{--c:var(--sc)} [data-s="hi"]{--c:var(--hi)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);white-space:nowrap}

/* slate */
.slate{background:var(--ink);color:var(--bg);border-radius:var(--r);overflow:hidden}
.stripes{height:18px;background:repeating-linear-gradient(-45deg,var(--bg) 0 14px,var(--ink) 14px 28px);opacity:.92}
.slate-body{padding:16px 18px 18px;display:grid;grid-template-columns:1fr auto;gap:14px 20px;align-items:end}
.slate h1{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
.slate h1 .rec{display:inline-block;width:.42em;height:.42em;border-radius:50%;background:var(--rec);vertical-align:.18em;margin-right:.3em;animation:blink 1.6s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}
.slate-meta{display:grid;grid-template-columns:repeat(3,auto);gap:4px 18px;font-size:12px}
.slate-meta dt{opacity:.6;letter-spacing:.06em;font-size:10.5px;text-transform:uppercase;font-family:var(--f-mono)}
.slate-meta dd{margin:0;font-weight:600}
.slate-sub{grid-column:1/-1;font-size:13px;opacity:.75;margin-top:-6px}

/* hero */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:16px}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pct{font-family:var(--f-display);font-size:56px;line-height:.9}
.pct small{font-size:24px;margin-left:2px}
.pct-label{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--sunk);border-radius:10px;padding:10px 12px;min-width:0}
.stat b{display:block;font-size:18px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.stat span{font-size:12px;color:var(--muted)}
.reel{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;position:relative;padding-top:18px}
.frame{height:34px;border-radius:4px;background:var(--sunk);position:relative;overflow:hidden}
.frame i{position:absolute;inset:auto 0 0 0;background:var(--good);opacity:.85}
.frame.today{outline:2px solid var(--rec);outline-offset:1px}
.frame.late{background:var(--rec-soft)}
.reel .wk{position:absolute;top:0;font-size:10.5px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}
.reel-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-family:var(--f-mono)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;background:var(--bg);padding-block:8px}
.tab{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 8px;font-weight:600;font-size:14px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* panels */
.panel{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0 0 4px;line-height:1.2}
.card h3{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;color:var(--rec);letter-spacing:.08em;font-weight:600}
.cheer{margin:8px 0 0;font-size:15px}
.note{background:color-mix(in srgb,var(--ma) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--ma) 30%,transparent);border-radius:12px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.note button{border:0;background:none;color:var(--muted);font-size:13px;flex:none;padding:2px 4px}
.muted{color:var(--muted)}

/* lecture row */
.list{display:flex;flex-direction:column;gap:8px}
.lec{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:12px;padding:12px 14px}
.lec:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line));border-left-color:var(--c)}
.lec .chk{width:30px;height:30px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 60%,var(--line));display:grid;place-items:center;flex:none}
.lec .chk svg{width:16px;height:16px;opacity:0}
.lec.done .chk{background:var(--c);border-color:var(--c)}
.lec.done .chk svg{opacity:1}
.lec-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.lec-head{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lec-no{font-weight:700;font-size:14px}
.lec-title{font-size:14px;color:var(--ink);overflow-wrap:anywhere}
.lec.done .lec-title{color:var(--muted)}
.lec-fb{font-size:12px;color:var(--muted)}
.lec-tc{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.lec.big{padding:16px}
.lec.big .chk{width:36px;height:36px}
.lec.big .lec-title{font-size:15.5px}

/* schedule */
.week{display:flex;flex-direction:column;gap:10px}
.week-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.week-h h2{margin:0}
.day{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.day.is-today{border-color:var(--rec);box-shadow:0 0 0 1px var(--rec) inset}
.day-date{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.day-date b{font-family:var(--f-mono);font-size:16px;font-weight:600}
.day-date span{font-size:12px;color:var(--muted)}
.day-date .wkend{color:var(--rec)}
.badge{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;font-family:var(--f-mono);letter-spacing:.04em}
.badge.today{background:var(--rec);color:#fff}
.badge.late{background:var(--rec-soft);color:var(--rec)}
.badge.clear{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.day .list{gap:6px}
.day .lec{padding:9px 12px;gap:10px}
.day .lec .chk{width:26px;height:26px}

/* report */
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:72px 1fr 52px;gap:10px;align-items:center;font-size:14px}
.bar{height:12px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--ink));border-radius:999px;transition:width .5s}
.bar-row .v{font-family:var(--f-mono);font-size:13px;text-align:right;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.insight{font-size:14px;margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--sunk)}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--sunk)}
.dots i.on{background:var(--c)}
.rv{display:flex;flex-direction:column;gap:8px}
.rv-item{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);border-left:4px solid var(--c)}
.rv-item p{margin:0;font-size:13.5px}
.empty{font-size:14px;color:var(--muted);padding:6px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px}
label.btn{display:inline-block;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--rec);border-color:color-mix(in srgb,var(--rec) 40%,var(--line))}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
input[type="date"],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
textarea{width:100%;min-height:72px;resize:vertical}
.sync{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on i{background:var(--good)}
#copyArea{width:100%;min-height:160px;font-family:var(--f-mono);font-size:12.5px;margin-top:12px}
.hero-actions{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hero-actions .btn{padding:9px 14px}
.hero-actions .btn[disabled]{opacity:.6;cursor:progress}
.saved{font-size:12px;color:var(--muted)}
@media (max-width:560px){.hero-actions{align-items:flex-start;width:100%}}
.pdfview{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pdfview-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.pdfview-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;position:sticky;top:0;background:var(--bg);padding-block:8px}
.pdfview-head p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.pdfview img{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.08)}
/* print layout (rendered off-screen into the PDF; plain hex colors on purpose) */
#print{position:absolute;left:-14000px;top:0;width:760px;background:#fff;color:#1A1D2A;font-family:var(--f-body);font-size:12px;line-height:1.45}
#print .pb{padding:4px 2px 10px;background:#fff}
#print .p-eye{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;color:#F0452F;font-weight:600}
#print h1{font-family:var(--f-display);font-weight:400;font-size:30px;margin:2px 0 4px}
#print h2{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
#print h2 small{font-family:var(--f-mono);font-size:11px;color:#656B80}
#print .p-meta{color:#656B80;font-size:11.5px}
#print .p-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
#print .p-stat{background:#F1F2F6;border-radius:8px;padding:8px 10px}
#print .p-stat b{display:block;font-family:var(--f-mono);font-size:16px}
#print .p-stat span{font-size:10.5px;color:#656B80}
#print .p-bar{display:grid;grid-template-columns:70px 1fr 40px;gap:8px;align-items:center;margin:5px 0}
#print .p-track{height:9px;background:#ECEEF3;border-radius:9px;overflow:hidden}
#print .p-track i{display:block;height:100%;border-radius:9px}
#print table{width:100%;border-collapse:collapse;table-layout:fixed}
#print th{white-space:nowrap;font-size:10.5px;color:#656B80;font-weight:600;text-align:left;padding:5px 6px;border-bottom:1.5px solid #1A1D2A}
#print td{padding:5px 6px;border-bottom:1px solid #E3E5EC;vertical-align:top;font-size:11.5px;overflow-wrap:anywhere}
#print td.dt{font-family:var(--f-mono);font-weight:600;border-right:1px solid #E3E5EC}

let dbRef=null, writing=false, again=false, dbRO=false;
let syncMode="local";
function setSync(mode){
  const changed=syncMode!==mode;syncMode=mode;
  if(changed)renderToday();
  const el=$("#syncBadge");
  const txt={local:"이 기기에만 저장돼요",shared:"선생님과 실시간 공유 중",readonly:"보기 권한이라 이 기기에만 저장돼요"}[mode];
  el.className="sync"+(mode==="shared"?" on":"");el.querySelector("span").textContent=txt;
  const r=$("#syncNote");if(r)r.textContent=txt;
}
async function pushDb(){
  if(!dbRef||dbRO)return;
  if(writing){again=true;return;}
  writing=true;
  try{await dbRef.set(JSON.parse(JSON.stringify(state)));}
  catch(e){if(e&&e.code==="invalid_argument"){dbRO=true;setSync("readonly");}}
  writing=false;
  if(again){again=false;pushDb();}
}
(async()=>{
  try{
    if(!window.claude||!window.claude.use)return;
    const db=await window.claude.use("db"); if(!db)return;
    dbRef=db.doc("plans/soyoung");
    let first=true;
    dbRef.onSnapshot(snap=>{
      const remote=snap.exists?snap.data():null;
      const ru=remote?(+remote.updatedAt||0):0;
      if(remote&&ru>state.updatedAt){state=normalize(JSON.parse(JSON.stringify(remote)));saveLocal();renderAll();}
      else if(first&&state.updatedAt>ru){pushDb();}
      first=false;
      if(!dbRO)setSync("shared");
    },()=>{dbRef=null;setSync("local");});
  }catch(e){}
})();

/* ---------- derived ---------- */
const isDone = id=>!!state.done[id];
const doneCount = ()=>Object.keys(state.done).filter(id=>L[id]).length;
function overdue(){const out=[];DAYS.forEach(d=>{if(d.d<todayKey)d.items.forEach(id=>{if(!isDone(id))out.push({id,d:d.d});});});return out;}
function streak(){
  const set=new Set(Object.values(state.done).map(f=>f&&f.date).filter(Boolean));
  let cur=new Date();if(!set.has(keyOf(cur)))cur.setDate(cur.getDate()-1);
  let n=0;while(set.has(keyOf(cur))){n++;cur.setDate(cur.getDate()-1);}
  return n;
}

/* ---------- render: hero ---------- */

  const n=doneCount(), p=Math.round(n/TOTAL*100);
  $("#pct").textContent=p;

  $("#stTc").textContent=tc(s);
  $("#stStreak").textContent=streak()+"일";
  if(state.updatedAt){const t=new Date(state.updatedAt);const h=t.getHours();
    $("#savedAt").textContent="체크하면 자동 저장 · 마지막 "+(t.getMonth()+1)+"/"+t.getDate()+" "+(h<12?"오전 ":"오후 ")+((h%12)||12)+":"+pad(t.getMinutes());}
  else $("#savedAt").textContent="체크하면 자동으로 저장돼요";

    $("#stDday").textContent=dd>0?"D-"+dd:dd===0?"D-DAY":"완료";
    $("#stDdayLabel").textContent="플랜 마감(11.15)까지";
  }
  const reel=$("#reel");
  reel.innerHTML=DAYS.map((d,i)=>{
    const done=d.items.filter(isDone).length, f=done/d.items.length;
    const late=d.d<todayKey&&done<d.items.length;
    const cls="frame"+(d.d===todayKey?" today":"")+(late?" late":"");
    return '<div class="'+cls+'" title="'+mmdd(d.d)+' ('+wd(d.d)+') '+done+'/'+d.items.length+'"><i style="height:'+(f*100)+'%"></i></div>';
  }).join("")+
  '<span class="wk" style="left:0">1주차</span><span class="wk" style="left:30%">2주차</span><span class="wk" style="left:65%">3주차</span>';

/* ---------- lecture row ---------- */
const CHECK_SVG='<svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
function fbLine(f){
  if(!f)return "";
  const parts=[];
  if(f.date)parts.push(mmdd(f.date)+(f.slot?" "+SLOT_NAME[f.slot]:""));
  if(f.diff)parts.push("난이도 "+f.diff);
  if(f.und)parts.push("이해 "+f.und);
  if(f.fit)parts.push(FIT_NAME[f.fit]);
  if(f.speed&&f.speed!=="1")parts.push(f.speed+"×");
  return parts.join(" · ");
}
function lecRow(id,big){
  const l=L[id], f=state.done[id], done=!!f;
  const sub=done?'<span class="lec-fb">'+esc(fbLine(f)||"완료")+(f.memo?" · 메모 있음":"")+'</span>':'';
  return '<button class="lec'+(done?" done":"")+(big?" big":"")+'" data-s="'+l.s+'" data-open="'+id+'" aria-label="'+esc(lecLabel(l)+" "+lecTitle(l)+(done?" 완료됨, 피드백 수정":" 체크하기"))+'">'+
    '<span class="chk">'+CHECK_SVG+'</span>'+
    '<span class="lec-main"><span class="lec-head"><span class="tag">'+SUBJ[l.s].name+'</span><span class="lec-no">'+l.n+'강</span></span>'+
    '<span class="lec-title">'+esc(lecTitle(l))+'</span>'+sub+'</span>'+
    '<span class="lec-tc">'+(l.dur?"TC "+l.dur:"")+'</span></button>';
}

/* ---------- render: today ---------- */
function dailyCheer(items){
  const left=items.filter(id=>!isDone(id));
  if(!items.length)return "";
  if(!left.length)return DAY_CLEAR;
  const mins=Math.round(left.reduce((a,id)=>a+secs(L[id].dur),0)/60);
  const hasMa=left.some(id=>L[id].s==="ma");
  const lines=[
    "오늘 남은 촬영 분량은 약 "+mins+"분. 하나씩 컷 해봐요.",
    hasMa?"수학이 있는 날! 집중력 좋은 시간대에 먼저 듣는 걸 추천해요.":"짧은 과학 강의부터 시작하면 시동 걸기 좋아요.",
    "강의 끝나면 바로 체크하고 한 줄 피드백 남기기!"
  ];
  return lines[new Date().getDate()%lines.length]+(mins?"":"");
}

  }else if(idx<0){

    html+='<div class="card"><div class="eyebrow">WRAP</div><h2>3주 촬영 일정이 끝났어요</h2><p class="cheer">'+(n===TOTAL?MILESTONE[100]:"39강 중 "+n+"강 완료. 남은 강의는 시험 전까지 아래 목록에서 마무리해요.")+'</p></div>';
  }else{
    const d=DAYS[idx];

}

  $("#p-all").innerHTML=weeks.map(([a,b,name,range])=>{
    const ds=DAYS.slice(a,b), tot=ds.reduce((s,d)=>s+d.items.length,0), dn=ds.reduce((s,d)=>s+d.items.filter(isDone).length,0);
    return '<div class="week"><div class="week-h"><h2 class="card-h" style="font-family:var(--f-display);font-weight:400;font-size:22px">'+name+' <span class="muted mono" style="font-size:13px">'+range+'</span></h2><span class="mono muted" style="font-size:13px">'+dn+'/'+tot+'</span></div>'+

      }).join("")+'</div>';
  }).join("");
}

/* ---------- toast + confetti ---------- */
let tt=null;
function toast(title,msg){const t=$("#toast");t.innerHTML='<b>'+esc(title)+'</b>'+esc(msg);t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),3200);}
function burst(count){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("#fx"),ctx=c.getContext("2d"),dpr=window.devicePixelRatio||1;
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;ctx.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement);
  const cols=["--ko","--ma","--so","--sc","--hi","--rec"].map(v=>cs.getPropertyValue(v).trim()||"#888");
  const ps=Array.from({length:count},()=>({x:innerWidth/2,y:innerHeight*.7,vx:(Math.random()-.5)*14,vy:-Math.random()*16-6,r:Math.random()*6+3,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.3,life:0}));
  let fr=0;
  (function step(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);ctx.restore();});
    if(++fr<120)requestAnimationFrame(step);else ctx.clearRect(0,0,innerWidth,innerHeight);
  })();
}

async function saveFile(filename,blob){

    try{const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);return "saved";}catch(e){return null;}
  }

  const root=buildPrint();
  try{
    if(document.fonts&&document.fonts.ready)await document.fonts.ready;
    const W=1240,H=1754,M=72,CW=W-M*2,FOOT=50,GAP=22;
    const pages=[];let ctx=null,y=0;
    const newPage=()=>{const c=document.createElement("canvas");c.width=W;c.height=H;ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,W,H);pages.push(c);y=M;};
    newPage();
    for(const el of root.querySelectorAll(".pb")){
      const cv=await window.html2canvas(el,{scale:2,backgroundColor:"#ffffff",logging:false});
      const ratio=CW/cv.width;let srcY=0;const total=cv.height;
      while(srcY<total){
        let room=H-M-FOOT-y;
        const need=(total-srcY)*ratio;
        if((need>room&&srcY===0&&y>M&&need<=H-M*2-FOOT)||(room<120&&y>M)){newPage();room=H-M-FOOT-y;}
        const sliceH=Math.min(total-srcY,Math.floor(room/ratio));
        ctx.drawImage(cv,0,srcY,cv.width,sliceH,M,y,CW,sliceH*ratio);
        srcY+=sliceH;y+=sliceH*ratio+GAP;
        if(srcY<total)newPage();
      }
    }
    const fam=getComputedStyle(document.body).fontFamily;
    pages.forEach((c,i)=>{const x=c.getContext("2d");x.fillStyle="#9AA0B4";x.font="22px "+fam;x.textAlign="right";x.fillText("소영의 기말 3주 촬영표 · "+(i+1)+" / "+pages.length,W-M,H-34);x.strokeStyle="#E3E5EC";x.lineWidth=2;x.beginPath();x.moveTo(M,H-66);x.lineTo(W-M,H-66);x.stroke();});
    return pages;
  }finally{root.remove();}
}
let pdfBusy=false;
async function makePdf(){
  if(pdfBusy)return;pdfBusy=true;
  const btns=document.querySelectorAll("[data-pdf]");btns.forEach(b=>{b.disabled=true;b.dataset.label=b.textContent;b.textContent="PDF 만드는 중…";});
  try{
    try{await loadLibs();}catch(e){toast("PDF 도구를 불러오지 못했어요","인터넷 연결을 확인하고 다시 눌러 주세요.");return;}
    const pages=await renderPages();
    const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
    pages.forEach((c,i)=>{if(i)pdf.addPage();pdf.addImage(c.toDataURL("image/jpeg",0.9),"JPEG",0,0,210,297);});
    const blob=pdf.output("blob");
    const fname="soyoung_plan_report_"+keyOf(new Date()).slice(5).replace("-","")+".pdf";
    const r=await saveFile(fname,blob);
    if(r==="saved"){toast("PDF 저장 완료",fname);return;}
    if(r==="declined"||r==="busy")return;
    showPages(pages);
  }catch(e){toast("PDF를 만들지 못했어요","잠시 후 다시 눌러 주세요.");}
  finally{pdfBusy=false;btns.forEach(b=>{b.disabled=false;b.textContent=b.dataset.label||"PDF로 저장";});}
}
function showPages(pages){
  const v=document.createElement("div");v.className="pdfview";v.id="pdfview";v.setAttribute("role","dialog");v.setAttribute("aria-label","PDF 페이지 이미지");
  v.innerHTML='<div class="pdfview-in"><div class="pdfview-head"><div><h2 style="font-family:var(--f-display);font-weight:400;font-size:22px;margin:0">리포트 이미지</h2><p>이 화면에서는 PDF 파일을 바로 내려받을 수 없어요. 이미지를 길게 눌러 \'사진에 저장\'하거나 화면을 캡처해 주세요.</p></div><button class="btn" data-closeview>닫기</button></div>'+
    pages.map((c,i)=>'<img alt="리포트 '+(i+1)+'쪽" src="'+c.toDataURL("image/png")+'">').join("")+'</div>';
  document.body.appendChild(v);v.querySelector("[data-closeview]").focus();
}
function copyText(txt,title,msg){
  const done=()=>{state.lastBackup=Date.now();commit();toast(title,msg);};
  const fallback=()=>{
    selectTab("report");
    const area=$("#copyArea");if(!area)return;
    area.hidden=false;area.value=txt;area.focus();area.select();
    state.lastBackup=Date.now();saveLocal();
    toast("아래 칸의 글을 길게 눌러 복사해요","");
  };
  try{navigator.clipboard.writeText(txt).then(done,fallback);}catch(err){fallback();}
}
document.addEventListener("change",e=>{
  if(e.target.id==="examDate"){state.examDate=e.target.value;commit();return;}
  if(e.target.id==="logFile"){const f=e.target.files&&e.target.files[0];e.target.value="";if(f)loadLog(f);}
});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;const v=$("#pdfview");if(v){v.remove();return;}if(cur)closeSheet();});
function selectTab(name){
  ["today","all","report"].forEach(n=>{$("#tab-"+n).setAttribute("aria-selected",String(n===name));$("#p-"+n).hidden=n!==name;});
  try{localStorage.setItem(LS_KEY+"-tab",name);}catch(e){}
}

renderAll();
try{const t=localStorage.getItem(LS_KEY+"-tab");if(t&&["today","all","report"].includes(t))selectTab(t);}catch(e){}
})();
</script>
